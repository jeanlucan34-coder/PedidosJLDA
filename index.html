<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLDA Perfumaria — Controle de Pedidos</title>

<!-- Firebase (Realtime Database) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<style>
  html, body{ margin:0; padding:0; }
  *{box-sizing:border-box;}
  :root{
    --ink:#231822;
    --plum:#3B2436;
    --plum-2:#4E2F44;
    --cream:#F7F1E8;
    --gold:#C6A15B;
    --gold-soft:#E4D3AC;
    --rose:#C0776A;
    --sage:#7C8A6E;
    --line: rgba(255,255,255,0.10);
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Manrope', -apple-system, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap');

  body{
    font-family:var(--font-body);
    background: radial-gradient(1200px 600px at 10% -10%, #4a2c40 0%, var(--plum) 45%, var(--ink) 100%);
    color: var(--cream);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:1000px;margin:0 auto; padding: 28px 20px 60px;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    width:100%; max-width:380px; background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border:1px solid var(--gold); border-radius:18px; padding:32px 28px;
  }
  .login-card .eyebrow{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold-soft); opacity:.85; text-align:center;}
  .login-card h1{ font-family:var(--font-display); font-weight:600; font-size:34px; text-align:center; margin:4px 0 22px; color:var(--cream); }
  .login-card h1 em{ font-style:italic; color:var(--gold); }
  .login-field{ margin-bottom:14px; display:flex; flex-direction:column; gap:6px; }
  .login-field label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold-soft); opacity:.85; }
  .user-toggle{ display:flex; gap:8px; }
  .user-toggle button{
    flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,0.05);
    color:var(--cream); font-family:var(--font-body); font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .user-toggle button.active{ border-color:var(--gold); background:rgba(198,161,91,0.18); color:var(--gold-soft); }
  #login-error{ color:var(--rose); font-size:13px; margin-top:10px; min-height:16px; text-align:center; }
  #firebase-warning{
    max-width:380px; margin:16px auto 0; font-size:12px; color:var(--gold-soft); opacity:.75; text-align:center; line-height:1.5;
  }

  /* ---------- APP ---------- */
  #jlda-app{ display:none; }

  .top{
    display:flex; justify-content:space-between; align-items:flex-end; gap:16px;
    border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:20px;
    flex-wrap:wrap;
  }
  .brand-eyebrow{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold-soft); opacity:.85; }
  .brand h1{ font-family:var(--font-display); font-weight:600; font-size:38px; margin:2px 0 0; color:var(--cream); }
  .brand h1 em{ font-style:italic; color:var(--gold); }
  .top-right{ text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .top-meta{ font-size:13px; color:var(--gold-soft); opacity:.9; }
  .top-meta .num{ font-family:var(--font-display); font-size:26px; color:var(--cream); display:block; line-height:1;}
  .btn-logout{ background:transparent; border:1px solid var(--rose); color:var(--rose); border-radius:8px; padding:5px 12px; font-size:12px; cursor:pointer; font-family:var(--font-body); }

  .store-tabs{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .store-tab{
    padding:9px 16px; border-radius:20px; border:1px solid var(--line); background:rgba(255,255,255,0.04);
    color:var(--gold-soft); font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font-body);
  }
  .store-tab.active{ border-color:var(--gold); background:rgba(198,161,91,0.18); color:var(--cream); }

  .section-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .section-tab{
    padding:8px 16px; border-radius:10px 10px 0 0; border:1px solid var(--line); border-bottom:none;
    background:rgba(255,255,255,0.03); color:var(--gold-soft); font-size:13.5px; font-weight:600; cursor:pointer; font-family:var(--font-body);
  }
  .section-tab.active{ background:rgba(198,161,91,0.14); color:var(--cream); border-color:var(--gold); }

  .stats{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:18px; }
  @media (max-width:900px){ .stats{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr);} }
  .stat{
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border:1px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .stat:hover{ transform:translateY(-2px); border-color:rgba(198,161,91,0.5); }
  .stat.active{ border-color:var(--gold); background:linear-gradient(160deg, rgba(198,161,91,0.14), rgba(198,161,91,0.03)); }
  .stat .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold-soft); opacity:.85;}
  .stat .value{ font-family:var(--font-display); font-size:30px; margin-top:4px; color:var(--cream); }
  .stat .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; }

  .money-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:12px; }
  @media (max-width:720px){ .money-stats{ grid-template-columns:1fr; } }
  .money-card{
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border:1px solid var(--line); border-radius:14px; padding:14px 16px;
  }
  .money-card .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold-soft); opacity:.85;}
  .money-card .value{ font-family:var(--font-display); font-size:26px; margin-top:4px; }
  .money-card.highlight{ border-color:rgba(214,140,60,0.6); background:linear-gradient(160deg, rgba(214,140,60,0.14), rgba(214,140,60,0.02)); }
  .money-card.highlight .value{ color:#E9B679; }
  .money-card.profit{ border-color:rgba(124,138,110,0.6); background:linear-gradient(160deg, rgba(124,138,110,0.16), rgba(124,138,110,0.02)); }
  .money-card.profit .value{ color:#B7C7A5; }
  .money-card.profit.negative{ border-color:rgba(192,119,106,0.6); background:linear-gradient(160deg, rgba(192,119,106,0.16), rgba(192,119,106,0.02)); }
  .money-card.profit.negative .value{ color:#E4A79B; }

  .money-stats-row2{ margin-bottom:22px; }

  .controls{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
  input[type=text], input[type=password], select, textarea{
    background:rgba(255,255,255,0.06); border:1px solid var(--line); color:var(--cream);
    border-radius:10px; padding:10px 12px; font-family:var(--font-body); font-size:14px; outline:none;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--gold); }
  #search{ flex:1; min-width:180px; }
  .btn{
    background:var(--gold); color:var(--ink); border:none; border-radius:10px; padding:10px 18px;
    font-weight:700; font-size:14px; cursor:pointer; font-family:var(--font-body);
    transition:filter .15s ease, transform .15s ease;
  }
  .btn:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  .btn.ghost{ background:transparent; border:1px solid var(--gold); color:var(--gold-soft); }
  .btn.small{ padding:6px 12px; font-size:12.5px; }
  .btn.danger{ background:transparent; border:1px solid var(--rose); color:var(--rose); }

  .list{ display:flex; flex-direction:column; gap:10px; }
  .order{
    background:linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
    border:1px solid var(--line); border-radius:14px; padding:16px 18px;
    display:grid; grid-template-columns: 1.1fr 1.6fr .5fr auto; gap:14px; align-items:center;
  }
  @media (max-width:820px){ .order{ grid-template-columns:1fr; } }
  .order .cliente{ font-family:var(--font-display); font-size:20px; color:var(--cream); }
  .order .perfumes{ font-size:14px; color:var(--gold-soft); line-height:1.4; }
  .order .meta-row{ font-size:12px; color:rgba(247,241,232,0.55); margin-top:3px; }
  .badge-tam{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--cream); opacity:.8; margin-right:6px; }
  .badge-owner{ display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:20px; border:1px solid var(--gold); color:var(--gold-soft); margin-left:6px; }
  .obs{ font-size:12px; color:var(--rose); margin-top:4px; font-style:italic; }
  .status-badge{ font-size:11.5px; padding:6px 12px; border-radius:20px; font-weight:700; letter-spacing:.03em; text-align:center; white-space:nowrap; text-transform:uppercase; }
  .status-pendente{ background:rgba(192,119,106,0.18); color:#E4A79B; border:1px solid rgba(192,119,106,0.5); }
  .status-pago{ background:rgba(198,161,91,0.18); color:var(--gold-soft); border:1px solid rgba(198,161,91,0.5); }
  .status-entregue{ background:rgba(124,138,110,0.22); color:#B7C7A5; border:1px solid rgba(124,138,110,0.6); }
  .status-receber{ background:rgba(214,140,60,0.20); color:#E9B679; border:1px solid rgba(214,140,60,0.6); }
  .valor-line{ font-size:12.5px; color:var(--gold-soft); opacity:.9; margin-top:5px; }
  .valor-line .receber{ color:#E9B679; font-weight:700; }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }

  .expense{
    background:linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
    border:1px solid var(--line); border-radius:14px; padding:16px 18px;
    display:grid; grid-template-columns: 1fr auto auto; gap:14px; align-items:center;
  }
  @media (max-width:600px){ .expense{ grid-template-columns:1fr; } }
  .expense .desc{ font-family:var(--font-display); font-size:19px; color:var(--cream); }
  .expense .data-txt{ font-size:12px; color:rgba(247,241,232,0.55); margin-top:2px; }
  .expense .valor{ font-family:var(--font-display); font-size:22px; color:var(--rose); }

  .empty{ text-align:center; padding:50px 20px; color:var(--gold-soft); opacity:.8; font-family:var(--font-display); font-size:20px;}

  .modal-bg{ position:fixed; inset:0; background:rgba(10,6,10,0.6); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:linear-gradient(160deg, #4E2F44, #2c1b28); border:1px solid var(--gold); border-radius:16px; padding:26px; width:100%; max-width:440px; max-height:90vh; overflow:auto; }
  .modal h3{ font-family:var(--font-display); font-size:26px; margin:0 0 16px; color:var(--gold-soft); }
  .field{ margin-bottom:12px; display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold-soft); opacity:.85; }
  .field input, .field select, .field textarea{ width:100%; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }

  .footer-note{ text-align:center; margin-top:30px; font-size:12px; color:rgba(247,241,232,0.4); }
  ::placeholder{ color: rgba(247,241,232,0.35); }
  .sync-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; background:#7C8A6E; }
  .sync-dot.off{ background:var(--rose); }
</style>
</head>
<body>

<div id="login-screen">
  <div>
    <div class="login-card">
      <div class="eyebrow">Controle de pedidos</div>
      <h1>JLDA <em>Perfumaria</em></h1>
      <div class="login-field">
        <label>Quem é você?</label>
        <div class="user-toggle">
          <button type="button" id="tab-master" class="active">Master</button>
          <button type="button" id="tab-saymon">Saymon</button>
        </div>
      </div>
      <div class="login-field">
        <label>Senha</label>
        <input type="password" id="login-password" placeholder="Digite sua senha">
      </div>
      <button class="btn" id="btn-login" style="width:100%;">Entrar</button>
      <div id="login-error"></div>
    </div>
    <div id="firebase-warning"></div>
  </div>
</div>

<div id="jlda-app">
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="brand-eyebrow">Controle de pedidos <span id="sync-indicator"><span class="sync-dot off"></span>conectando...</span></div>
        <h1>JLDA <em>Perfumaria</em></h1>
      </div>
      <div class="top-right">
        <div class="top-meta"><span class="num" id="total-count">0</span>pedidos registrados</div>
        <button class="btn-logout" id="btn-logout">Sair</button>
      </div>
    </div>

    <div class="store-tabs" id="store-tabs" style="display:none;"></div>

    <div class="section-tabs" id="section-tabs">
      <div class="section-tab active" data-section="pedidos">Pedidos</div>
      <div class="section-tab" data-section="gastos" id="tab-gastos">Insumos e gastos</div>
    </div>

    <!-- PEDIDOS SECTION -->
    <div id="section-pedidos">
      <div class="stats" id="stats"></div>
      <div class="money-stats" id="money-stats"></div>
      <div class="money-stats money-stats-row2" id="money-stats-2"></div>

      <div class="controls">
        <input type="text" id="search" placeholder="Buscar por cliente ou perfume...">
        <select id="filter-tamanho">
          <option value="todos">Todos os tamanhos</option>
          <option value="30ml">30ml</option>
          <option value="50ml">50ml</option>
        </select>
        <button class="btn" id="btn-add">+ Novo pedido</button>
      </div>

      <div class="list" id="list"></div>
      <div class="empty" id="empty" style="display:none;">Nenhum pedido encontrado.</div>
    </div>

    <!-- GASTOS SECTION -->
    <div id="section-gastos" style="display:none;">
      <div class="money-stats" id="expense-stats"></div>
      <div class="controls">
        <button class="btn" id="btn-add-expense">+ Novo gasto (insumo)</button>
      </div>
      <div class="list" id="expense-list"></div>
      <div class="empty" id="expense-empty" style="display:none;">Nenhum gasto registrado ainda.</div>
    </div>

    <div class="footer-note">
      Toque em um cartão para editar ou excluir.<br>
      <button class="btn ghost small" id="btn-export" style="margin-top:10px;">Exportar backup</button>
    </div>
  </div>
</div>

<div id="modal-root"></div>

    {cliente:"Vô de Saymon", perfumes:"Blue Chanel", tamanho:"50ml", quantidade:1, status:"pendente"},
    {cliente:"Juliano", perfumes:"Legacy D, Toh", tamanho:"50ml", quantidade:2, status:"pendente"},
    {cliente:"Rodrigo", perfumes:"Legacy D, Scuderia, Wolf Boy", tamanho:"50ml", quantidade:3, status:"pendente"},
    {cliente:"Lidiane", perfumes:"Toh, Paradoxe", tamanho:"50ml", quantidade:2, status:"pendente"}
  ].map(o => {
    const unit = o.tamanho === '30ml' ? PRECO_30 : PRECO_50;
    const total = unit * o.quantidade;
    let recebido;
    if(o.valorRecebidoOverride !== undefined){ recebido = o.valorRecebidoOverride; }
    else if(o.status === 'entregue' || o.status === 'pago'){ recebido = total; }
    else { recebido = 0; }
    return { id: uid(), obs:"", ...o, valorUnitario: unit, valorRecebido: recebido };
  });

  function uid(){ return 'o_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  // ---------------- LOGIN ----------------
  document.getElementById('tab-master').addEventListener('click', () => selectLoginUser('master'));
  document.getElementById('tab-saymon').addEventListener('click', () => selectLoginUser('saymon'));
  function selectLoginUser(u){
    selectedLoginUser = u;
    document.getElementById('tab-master').classList.toggle('active', u==='master');
    document.getElementById('tab-saymon').classList.toggle('active', u==='saymon');
  }

  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('login-password').addEventListener('keydown', (e) => { if(e.key === 'Enter') doLogin(); });

  function doLogin(){
    const pass = document.getElementById('login-password').value;
    const u = USERS[selectedLoginUser];
    if(pass === u.password){
      currentUser = { username: selectedLoginUser, role: u.role, owner: u.owner, label: u.label };
      localStorage.setItem('jlda_session', JSON.stringify(currentUser));
      startApp();
    }else{
      document.getElementById('login-error').textContent = 'Senha incorreta.';
    }
  }

  document.getElementById('btn-logout').addEventListener('click', () => {
    localStorage.removeItem('jlda_session');
    location.reload();
  });

  // ---------------- FIREBASE SYNC ----------------
  function attachListeners(){
    if(!firebaseOk){
      document.getElementById('sync-indicator').innerHTML = '<span class="sync-dot off"></span>sem sincronização (configure o Firebase)';
      // still allow local-only usage with seed data
      ordersByOwner.jlda = seedJlda;
      render();
      return;
    }
    document.getElementById('sync-indicator').innerHTML = '<span class="sync-dot"></span>sincronizado';

    const ownersToWatch = currentUser.role === 'master' ? ['jlda','saymon'] : [currentUser.owner];

    ownersToWatch.forEach(owner => {
      db.ref('orders/' + owner).on('value', (snap) => {
        const val = snap.val();
        ordersByOwner[owner] = val ? Object.values(val) : [];
        // seed JLDA orders on very first run ever (only master, only jlda, only if empty)
        if(owner === 'jlda' && (!val || Object.keys(val).length === 0) && currentUser.owner === 'jlda'){
          db.ref('orders/jlda').set(arrToObj(seedJlda));
        }
        render();
      });
      db.ref('expenses/' + owner).on('value', (snap) => {
        const val = snap.val();
        expensesByOwner[owner] = val ? Object.values(val) : [];
        render();
      });
    });
  }

  function arrToObj(arr){
    const o = {};
    arr.forEach(item => { o[item.id] = item; });
    return o;
  }

  async function saveOrders(owner){
    if(!firebaseOk) return;
    await db.ref('orders/' + owner).set(arrToObj(ordersByOwner[owner]));
  }
  async function saveExpenses(owner){
    if(!firebaseOk) return;
    await db.ref('expenses/' + owner).set(arrToObj(expensesByOwner[owner]));
  }

  // ---------------- HELPERS ----------------
  function statusLabel(s){
    if(s === 'pendente') return 'A entregar';
    if(s === 'pago') return 'Pago';
    if(s === 'entregue_receber') return 'Entregue - a receber';
    if(s === 'entregue') return 'Pago e entregue';
    return s;
  }
  function statusClass(s){
    if(s === 'pendente') return 'status-pendente';
    if(s === 'pago') return 'status-pago';
    if(s === 'entregue_receber') return 'status-receber';
    return 'status-entregue';
  }
  function fmtBRL(v){ return 'R$ ' + (Math.round(v*100)/100).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function valorTotal(o){ return (o.valorUnitario||0) * (o.quantidade||0); }
  function valorAReceber(o){ return Math.max(0, valorTotal(o) - (o.valorRecebido||0)); }
  function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str||''; return d.innerHTML; }

  function ownersInView(){
    if(currentUser.role !== 'master') return [currentUser.owner];
    if(currentStoreView === 'all') return ['jlda','saymon'];
    return [currentStoreView];
  }

  function ordersInView(){
    let list = [];
    ownersInView().forEach(o => { (ordersByOwner[o]||[]).forEach(item => list.push({...item, owner:o})); });
    return list;
  }
  function expensesInView(){
    let list = [];
    ownersInView().forEach(o => { (expensesByOwner[o]||[]).forEach(item => list.push({...item, owner:o})); });
    return list;
  }

  // ---------------- STORE TABS (master only) ----------------
  function renderStoreTabs(){
    const el = document.getElementById('store-tabs');
    if(currentUser.role !== 'master'){ el.style.display = 'none'; return; }
    el.style.display = 'flex';
    const defs = [
      {key:'jlda', label:'Minha loja (JLDA)'},
      {key:'saymon', label:'Saymon'},
      {key:'all', label:'Tudo junto'},
    ];
    el.innerHTML = defs.map(d => `<div class="store-tab ${currentStoreView===d.key?'active':''}" data-store="${d.key}">${d.label}</div>`).join('');
    el.querySelectorAll('.store-tab').forEach(elm => {
      elm.addEventListener('click', () => { currentStoreView = elm.getAttribute('data-store'); render(); });
    });
  }

  function canAddOrEdit(){
    // master viewing "all" is read-only; master viewing a specific store, or reseller, can manage
    return !(currentUser.role === 'master' && currentStoreView === 'all');
  }

  // ---------------- SECTION TABS ----------------
  document.querySelectorAll('.section-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentSection = tab.getAttribute('data-section');
      document.querySelectorAll('.section-tab').forEach(t => t.classList.toggle('active', t===tab));
      document.getElementById('section-pedidos').style.display = currentSection === 'pedidos' ? 'block' : 'none';
      document.getElementById('section-gastos').style.display = currentSection === 'gastos' ? 'block' : 'none';
    });
  });

  // ---------------- STATS ----------------
  function computeStats(){
    const list = ordersInView();
    const counts = { todos: list.length, pendente:0, pago:0, entregue:0, entregue_receber:0 };
    list.forEach(o => counts[o.status] = (counts[o.status]||0)+1);
    return counts;
  }

  function renderStats(){
    const c = computeStats();
    const el = document.getElementById('stats');
    const defs = [
      {key:'todos', label:'Todos', value:c.todos, dot:'#C6A15B'},
      {key:'pendente', label:'A entregar', value:c.pendente||0, dot:'#C0776A'},
      {key:'pago', label:'Pagos (a entregar)', value:c.pago||0, dot:'#C6A15B'},
      {key:'entregue_receber', label:'Entregues (a receber)', value:c.entregue_receber||0, dot:'#D68C3C'},
      {key:'entregue', label:'Pagos e entregues', value:c.entregue||0, dot:'#7C8A6E'},
    ];
    el.innerHTML = defs.map(d => `
      <div class="stat ${activeFilter===d.key?'active':''}" data-filter="${d.key}">
        <div class="label"><span class="dot" style="background:${d.dot}"></span>${d.label}</div>
        <div class="value">${d.value}</div>
      </div>`).join('');
    el.querySelectorAll('.stat').forEach(elm => {
      elm.addEventListener('click', () => { activeFilter = elm.getAttribute('data-filter'); render(); });
    });
    document.getElementById('total-count').textContent = c.todos;
  }

  function renderMoneyStats(){
    const list = ordersInView();
    let total = 0, recebido = 0;
    list.forEach(o => { total += valorTotal(o); recebido += (o.valorRecebido||0); });
    const aReceber = total - recebido;
    const isSaymonOnly = currentUser.role !== 'master' && currentUser.owner === 'saymon';
    const labelTotal = isSaymonOnly ? 'Total a ganhar (sua parte)' : 'Total em vendas';
    const labelRecebido = isSaymonOnly ? 'Já recebido (sua parte)' : 'Já recebido';
    document.getElementById('money-stats').innerHTML = `
      <div class="money-card"><div class="label">${labelTotal}</div><div class="value">${fmtBRL(total)}</div></div>
      <div class="money-card"><div class="label">${labelRecebido}</div><div class="value">${fmtBRL(recebido)}</div></div>
      <div class="money-card highlight"><div class="label">Falta receber</div><div class="value">${fmtBRL(aReceber)}</div></div>
    `;

    const row2 = document.getElementById('money-stats-2');
    if(isSaymonOnly){
      row2.style.display = 'none';
      return;
    }
    row2.style.display = 'grid';
    const gastos = expensesInView().reduce((s,e) => s + (e.valor||0), 0);
    const lucro = recebido - gastos;
    const margem = recebido > 0 ? (lucro / recebido * 100) : 0;
    row2.innerHTML = `
      <div class="money-card"><div class="label">Gasto com insumos</div><div class="value" style="color:var(--rose)">${fmtBRL(gastos)}</div></div>
      <div class="money-card profit ${lucro<0?'negative':''}"><div class="label">Lucro (recebido − gastos)</div><div class="value">${fmtBRL(lucro)}</div></div>
      <div class="money-card profit ${lucro<0?'negative':''}"><div class="label">Margem de lucro</div><div class="value">${margem.toFixed(1)}%</div></div>
    `;
  }

  function renderExpenseStats(){
    const list = expensesInView();
    const total = list.reduce((s,e) => s + (e.valor||0), 0);
    document.getElementById('expense-stats').innerHTML = `
      <div class="money-card highlight"><div class="label">Total gasto em insumos</div><div class="value">${fmtBRL(total)}</div></div>
      <div class="money-card"><div class="label">Quantidade de lançamentos</div><div class="value">${list.length}</div></div>
      <div class="money-card"><div class="label">Gasto médio por lançamento</div><div class="value">${fmtBRL(list.length ? total/list.length : 0)}</div></div>
    `;
  }

  // ---------------- ORDERS LIST ----------------
  function matches(o){
    if(activeFilter !== 'todos' && o.status !== activeFilter) return false;
    if(activeTamanho !== 'todos' && o.tamanho !== activeTamanho) return false;
    if(searchTerm){
      const t = searchTerm.toLowerCase();
      if(!o.cliente.toLowerCase().includes(t) && !o.perfumes.toLowerCase().includes(t)) return false;
    }
    return true;
  }

  function renderList(){
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const filtered = ordersInView().filter(matches);
    const showOwnerTag = currentUser.role === 'master' && currentStoreView === 'all';
    const editable = canAddOrEdit();
    if(filtered.length === 0){ list.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display = 'none';
    list.innerHTML = filtered.map(o => {
      const total = valorTotal(o);
      const receber = valorAReceber(o);
      return `
      <div class="order" data-id="${o.id}" data-owner="${o.owner}">
        <div>
          <div class="cliente">${escapeHtml(o.cliente)}${showOwnerTag ? `<span class="badge-owner">${o.owner === 'jlda' ? 'JLDA' : 'Saymon'}</span>` : ''}</div>
          <div class="meta-row"><span class="badge-tam">${o.tamanho}</span>Qtd: ${o.quantidade}</div>
        </div>
        <div>
          <div class="perfumes">${escapeHtml(o.perfumes)}</div>
          ${o.obs ? `<div class="obs">${escapeHtml(o.obs)}</div>` : ''}
          <div class="valor-line">${fmtBRL(total)}${receber > 0 ? ` &middot; <span class="receber">${fmtBRL(receber)} a receber</span>` : ''}</div>
        </div>
        <div><span class="status-badge ${statusClass(o.status)}">${statusLabel(o.status)}</span></div>
        <div class="row-actions">
          ${editable ? `<button class="btn ghost small" data-action="edit">Editar</button><button class="btn danger small" data-action="del">Excluir</button>` : ''}
        </div>
      </div>`;
    }).join('');

    list.querySelectorAll('.order').forEach(card => {
      const id = card.getAttribute('data-id');
      const owner = card.getAttribute('data-owner');
      const editBtn = card.querySelector('[data-action="edit"]');
      const delBtn = card.querySelector('[data-action="del"]');
      if(editBtn) editBtn.addEventListener('click', () => openOrderModal(owner, id));
      if(delBtn) delBtn.addEventListener('click', () => deleteOrder(owner, id));
    });
  }

  async function deleteOrder(owner, id){
    if(!confirm('Excluir este pedido?')) return;
    ordersByOwner[owner] = ordersByOwner[owner].filter(o => o.id !== id);
    await saveOrders(owner);
    render();
  }

  function openOrderModal(owner, id){
    const isNew = !id;
    const defaultOwner = owner || (currentUser.role === 'master' ? currentStoreView : currentUser.owner);
    const precos = PRECOS[defaultOwner] || PRECOS.jlda;
    const o = isNew
      ? { id: uid(), cliente:'', perfumes:'', tamanho:'30ml', quantidade:1, status:'pendente', obs:'', valorUnitario: precos["30ml"], valorRecebido:0 }
      : ordersByOwner[owner].find(x => x.id === id);
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="modal-bg" id="modal-bg">
        <div class="modal">
          <h3>${isNew ? 'Novo pedido' : 'Editar pedido'}</h3>
          <div class="field"><label>Cliente</label><input type="text" id="f-cliente" value="${escapeHtml(o.cliente)}" placeholder="Nome do cliente"></div>
          <div class="field"><label>Perfume(s)</label><textarea id="f-perfumes" rows="2" placeholder="Ex: Legacy D, Yohanan">${escapeHtml(o.perfumes)}</textarea></div>
          <div class="field"><label>Tamanho</label>
            <select id="f-tamanho">
              <option value="30ml" ${o.tamanho==='30ml'?'selected':''}>30ml (R$ ${precos["30ml"]})</option>
              <option value="50ml" ${o.tamanho==='50ml'?'selected':''}>50ml (R$ ${precos["50ml"]})</option>
            </select>
          </div>
          <div class="field"><label>Quantidade (unidades)</label><input type="text" inputmode="numeric" id="f-qtd" value="${o.quantidade}"></div>
          <div class="field"><label>${defaultOwner === 'saymon' ? 'Sua parte por unidade (R$)' : 'Valor unitário (R$)'}</label><input type="text" inputmode="decimal" id="f-valor-unit" value="${o.valorUnitario}"></div>
          <div class="field"><label>Valor já recebido (R$)</label><input type="text" inputmode="decimal" id="f-valor-recebido" value="${o.valorRecebido}"></div>
          <div class="field"><label>Status</label>
            <select id="f-status">
              <option value="pendente" ${o.status==='pendente'?'selected':''}>A entregar</option>
              <option value="pago" ${o.status==='pago'?'selected':''}>Pago (não entregue)</option>
              <option value="entregue_receber" ${o.status==='entregue_receber'?'selected':''}>Entregue - a receber</option>
              <option value="entregue" ${o.status==='entregue'?'selected':''}>Pago e entregue</option>
            </select>
          </div>
          <div class="field"><label>Observação (opcional)</label><input type="text" id="f-obs" value="${escapeHtml(o.obs||'')}" placeholder="Ex: Pago 50% de entrada"></div>
          <div class="modal-actions">
            <button class="btn ghost" id="btn-cancel">Cancelar</button>
            <button class="btn" id="btn-save">Salvar</button>
          </div>
        </div>
      </div>`;
    document.getElementById('f-tamanho').addEventListener('change', (e) => {
      document.getElementById('f-valor-unit').value = precos[e.target.value];
    });
    document.getElementById('btn-cancel').addEventListener('click', closeModal);
    document.getElementById('modal-bg').addEventListener('click', (e) => { if(e.target.id === 'modal-bg') closeModal(); });
    document.getElementById('btn-save').addEventListener('click', async () => {
      const cliente = document.getElementById('f-cliente').value.trim();
      if(!cliente){ alert('Informe o nome do cliente.'); return; }
      const updated = {
        id: o.id, cliente,
        perfumes: document.getElementById('f-perfumes').value.trim(),
        tamanho: document.getElementById('f-tamanho').value,
        quantidade: parseInt(document.getElementById('f-qtd').value) || 1,
        valorUnitario: parseFloat(document.getElementById('f-valor-unit').value.replace(',','.')) || 0,
        valorRecebido: parseFloat(document.getElementById('f-valor-recebido').value.replace(',','.')) || 0,
        status: document.getElementById('f-status').value,
        obs: document.getElementById('f-obs').value.trim()
      };
      const targetOwner = defaultOwner;
      if(isNew){ ordersByOwner[targetOwner] = ordersByOwner[targetOwner] || []; ordersByOwner[targetOwner].unshift(updated); }
      else{ const idx = ordersByOwner[owner].findIndex(x => x.id === o.id); ordersByOwner[owner][idx] = updated; }
      await saveOrders(targetOwner);
      closeModal(); render();
    });
  }

  // ---------------- EXPENSES ----------------
  function renderExpenseList(){
    const list = document.getElementById('expense-list');
    const empty = document.getElementById('expense-empty');
    const items = expensesInView().sort((a,b) => (b.criadoEm||0) - (a.criadoEm||0));
    const showOwnerTag = currentUser.role === 'master' && currentStoreView === 'all';
    const editable = canAddOrEdit();
    if(items.length === 0){ list.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display = 'none';
    list.innerHTML = items.map(e => `
      <div class="expense" data-id="${e.id}" data-owner="${e.owner}">
        <div>
          <div class="desc">${escapeHtml(e.descricao || 'Insumo')}${showOwnerTag ? `<span class="badge-owner">${e.owner==='jlda'?'JLDA':'Saymon'}</span>` : ''}</div>
          ${e.data ? `<div class="data-txt">${escapeHtml(e.data)}</div>` : ''}
        </div>
        <div class="valor">${fmtBRL(e.valor||0)}</div>
        <div class="row-actions">
          ${editable ? `<button class="btn ghost small" data-action="edit">Editar</button><button class="btn danger small" data-action="del">Excluir</button>` : ''}
        </div>
      </div>
    `).join('');
    list.querySelectorAll('.expense').forEach(card => {
      const id = card.getAttribute('data-id');
      const owner = card.getAttribute('data-owner');
      const editBtn = card.querySelector('[data-action="edit"]');
      const delBtn = card.querySelector('[data-action="del"]');
      if(editBtn) editBtn.addEventListener('click', () => openExpenseModal(owner, id));
      if(delBtn) delBtn.addEventListener('click', () => deleteExpense(owner, id));
    });
  }

  async function deleteExpense(owner, id){
    if(!confirm('Excluir este gasto?')) return;
    expensesByOwner[owner] = expensesByOwner[owner].filter(e => e.id !== id);
    await saveExpenses(owner);
    render();
  }

  function openExpenseModal(owner, id){
    const isNew = !id;
    const defaultOwner = owner || (currentUser.role === 'master' ? currentStoreView : currentUser.owner);
    const e = isNew ? { id: uid(), descricao:'', valor:0, data:'' } : expensesByOwner[owner].find(x => x.id === id);
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="modal-bg" id="modal-bg">
        <div class="modal">
          <h3>${isNew ? 'Novo gasto (insumo)' : 'Editar gasto'}</h3>
          <div class="field"><label>Descrição (opcional)</label><input type="text" id="f-desc" value="${escapeHtml(e.descricao||'')}" placeholder="Ex: Compra de essências, frascos..."></div>
          <div class="field"><label>Valor total da nota (R$)</label><input type="text" inputmode="decimal" id="f-valor" value="${e.valor}"></div>
          <div class="field"><label>Data (opcional)</label><input type="text" id="f-data" value="${escapeHtml(e.data||'')}" placeholder="Ex: 29/07/2026"></div>
          <div class="modal-actions">
            <button class="btn ghost" id="btn-cancel">Cancelar</button>
            <button class="btn" id="btn-save">Salvar</button>
          </div>
        </div>
      </div>`;
    document.getElementById('btn-cancel').addEventListener('click', closeModal);
    document.getElementById('modal-bg').addEventListener('click', (ev) => { if(ev.target.id === 'modal-bg') closeModal(); });
    document.getElementById('btn-save').addEventListener('click', async () => {
      const valor = parseFloat(document.getElementById('f-valor').value.replace(',','.')) || 0;
      const updated = { id: e.id, descricao: document.getElementById('f-desc').value.trim(), valor, data: document.getElementById('f-data').value.trim(), criadoEm: e.criadoEm || Date.now() };
      const targetOwner = defaultOwner;
      if(isNew){ expensesByOwner[targetOwner] = expensesByOwner[targetOwner] || []; expensesByOwner[targetOwner].unshift(updated); }
      else{ const idx = expensesByOwner[owner].findIndex(x => x.id === e.id); expensesByOwner[owner][idx] = updated; }
      await saveExpenses(targetOwner);
      closeModal(); render();
    });
  }

  function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

  // ---------------- GLOBAL RENDER ----------------
  function render(){
    renderStoreTabs();
    renderStats();
    renderMoneyStats();
    renderExpenseStats();
    renderList();
    renderExpenseList();
    const editable = canAddOrEdit();
    document.getElementById('btn-add').style.display = editable ? 'inline-block' : 'none';
    document.getElementById('btn-add-expense').style.display = editable ? 'inline-block' : 'none';
  }

  document.getElementById('btn-add').addEventListener('click', () => openOrderModal(null, null));
  document.getElementById('btn-add-expense').addEventListener('click', () => openExpenseModal(null, null));
  document.getElementById('search').addEventListener('input', (e) => { searchTerm = e.target.value; renderList(); });
  document.getElementById('filter-tamanho').addEventListener('change', (e) => { activeTamanho = e.target.value; renderList(); });
  document.getElementById('btn-export').addEventListener('click', () => {
    const data = { ordersByOwner, expensesByOwner };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'jlda-backup.json'; a.click();
    URL.revokeObjectURL(url);
  });

  // ---------------- STARTUP ----------------
  function startApp(){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('jlda-app').style.display = 'block';
    if(currentUser.role !== 'master'){ currentStoreView = currentUser.owner; }
    if(currentUser.owner === 'saymon' && currentUser.role !== 'master'){
      document.getElementById('tab-gastos').style.display = 'none';
    }
    attachListeners();
  }

  if(!firebaseOk){
    document.getElementById('firebase-warning').textContent = 'O Firebase ainda não está configurado neste arquivo — os dados vão funcionar só neste navegador até você configurar a sincronização (veja as instruções que a Claude te enviou).';
  }

  // auto-login if session saved
  try{
    const saved = JSON.parse(localStorage.getItem('jlda_session') || 'null');
    if(saved && USERS[saved.username]){
      currentUser = saved;
      startApp();
    }
  }catch(e){}
})();
</script>
</body>
</html>
